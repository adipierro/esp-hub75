esphome:
  name: hub12-test
  friendly_name: HUB12 test

esp32:
  variant: esp32
  framework:
    type: esp-idf
    version: 5.5.2

logger:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [hub12]

display:
  - platform: hub12
    id: matrix
    # Path is relative to this YAML file on the ESPHome build machine.
    library_path: ../../components/hub75
    layout_cols: 1
    layout_rows: 1
    data_pin: GPIO23
    clk_pin: GPIO18
    a_pin: GPIO22
    b_pin: GPIO21
    oe_pin: GPIO25
    latch_pins: [GPIO32]
    # These match the reference project's panels; verify yours.
    invert_data: true
    invert_oe: true
    invert_latch: false
    clock_speed: 8MHZ
    brightness: 128
    bit_depth: 4
    gamma_correct: LINEAR
    double_buffer: false
    auto_clear_enabled: false
    update_interval: 5s
    lambda: |-
      static uint8_t phase = 0;
      phase = (phase + 1) % 3;
      if (phase == 0) {
        it.fill(Color::BLACK);
      } else if (phase == 1) {
        it.fill(Color::BLACK);
        it.filled_rectangle(0, 0, 8, 8, Color(255, 0, 0));
      } else {
        it.fill(Color(64, 0, 0));
        it.filled_rectangle(0, 0, 4, 4, Color(255, 0, 0));
      }
